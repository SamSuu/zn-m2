name: zn-m2 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "zn-m2/basic"
    paths:
      - ".github/workflows/zn-m2.yml"
      - "configs/zn-m2-basic.config"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/LiBwrt/openwrt-6.x.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add HomeProxy package
        run: |
          rm -rf openwrt/package/homeproxy
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git openwrt/package/homeproxy

      - name: Remove unused broken packages
        run: |
          rm -rf openwrt/feeds/packages/net/onionshare-cli

      - name: Patch kernel config for no-USB
        run: |
          cat >> openwrt/target/linux/qualcommax/ipq60xx/config-6.12 <<'EOF'

          # --- custom no-usb override for ZN M2 ---
          # CONFIG_USB_SUPPORT is not set
          # CONFIG_USB is not set
          # CONFIG_USB_ANNOUNCE_NEW_DEVICES is not set
          # CONFIG_USB_DEFAULT_PERSIST is not set
          # CONFIG_USB_STORAGE is not set
          # CONFIG_USB_UAS is not set
          # CONFIG_USB_XHCI_HCD is not set
          # CONFIG_USB_XHCI_PLATFORM is not set
          # CONFIG_USB_DWC3 is not set
          # CONFIG_USB_DWC3_QCOM is not set
          # CONFIG_PHY_QCOM_QMP_USB is not set
          # CONFIG_PHY_QCOM_QUSB2 is not set
          EOF

      - name: Prepare firstboot overrides
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          mkdir -p openwrt/files/etc

          cat > openwrt/files/etc/uci-defaults/zzz-20260416-force-ui-openwrt <<'EOF'
          #!/bin/sh

          uci -q delete luci.themes
          uci -q delete luci.languages

          uci -q batch <<'EOT'
          set luci.themes=internal
          set luci.themes.Bootstrap='/luci-static/bootstrap'

          set luci.languages=internal
          set luci.languages.zh_Hans='简体中文'

          set luci.main.mediaurlbase='/luci-static/bootstrap'
          set luci.main.lang='zh_Hans'

          set system.@system[0].hostname='OpenWrt'

          commit luci
          commit system
          EOT

          if [ -f /etc/openwrt_release ]; then
            sed -i "s/^DISTRIB_ID=.*/DISTRIB_ID='OpenWrt'/" /etc/openwrt_release
            sed -i "s/^DISTRIB_DESCRIPTION=.*/DISTRIB_DESCRIPTION='OpenWrt'/" /etc/openwrt_release
          fi

          for f in /etc/os-release /usr/lib/os-release; do
            [ -f "$f" ] || continue
            sed -i 's/^NAME=.*/NAME="OpenWrt"/' "$f"
            sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="OpenWrt"/' "$f"
            sed -i 's/^ID=.*/ID="openwrt"/' "$f"
          done

          for f in /etc/modules-boot.d/*usb* /etc/modules.d/*usb* /etc/modules.d/*uas* /etc/modules.d/*ums* /etc/modules.d/*ntfs*; do
            [ -e "$f" ] && rm -f "$f"
          done

          rmmod ums_usbat ums_sddr55 ums_sddr09 ums_karma ums_jumpshot ums_isd200 ums_freecom ums_datafab ums_cypress ums_alauda uas usb_storage 2>/dev/null || true

          rm -f /etc/uci-defaults/zzz-20260416-force-ui-openwrt
          exit 0
          EOF

          chmod +x openwrt/files/etc/uci-defaults/zzz-20260416-force-ui-openwrt

          cat > openwrt/files/etc/banner <<'EOF'
          -----------------------------------------------------
           OpenWrt
          -----------------------------------------------------
          EOF

      - name: Load config
        run: |
          cp configs/zn-m2-basic.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Force trim target device packages, USB and extra themes
        run: |
          cd openwrt

          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_qualcommax_ipq60xx_DEVICE_zn_m2=.*/d' .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_PACKAGES_qualcommax_ipq60xx_DEVICE_zn_m2="-ath11k-firmware-ipq6018 -cypress-nvram -kmod-ath11k -kmod-ath11k-ahb -kmod-cfg80211 -kmod-mac80211 -wpad-openssl -wireless-regdb -kmod-usb-core -kmod-usb2 -kmod-usb3 -kmod-usb-dwc3 -kmod-usb-dwc3-qcom -kmod-usb-phy-msm -kmod-usb-phy-qcom-dwc3 -kmod-phy-qcom-qusb2 -kmod-phy-qcom-qmp-usb -kmod-usb-xhci-hcd -kmod-usb-ehci -kmod-usb-ohci -kmod-usb-storage -kmod-usb-storage-extras -kmod-usb-storage-uas -kmod-usb-storage-alauda -kmod-usb-storage-cypress-atacb -kmod-usb-storage-datafab -kmod-usb-storage-freecom -kmod-usb-storage-isd200 -kmod-usb-storage-jumpshot -kmod-usb-storage-karma -kmod-usb-storage-sddr09 -kmod-usb-storage-sddr55 -kmod-usb-storage-usbat -usbutils -kmod-fs-ntfs3 -luci-theme-openwrt -luci-theme-openwrt-2020 -luci-theme-material -luci-theme-lightblue -luci-theme-design -luci-theme-argon -luci-app-argon-config"
          EOF

          disable_symbols=(
            CONFIG_DEFAULT_kmod-usb-core
            CONFIG_DEFAULT_kmod-usb2
            CONFIG_DEFAULT_kmod-usb3
            CONFIG_DEFAULT_kmod-usb-dwc3
            CONFIG_DEFAULT_kmod-usb-dwc3-qcom
            CONFIG_DEFAULT_kmod-usb-phy-msm
            CONFIG_DEFAULT_kmod-usb-phy-qcom-dwc3
            CONFIG_DEFAULT_kmod-phy-qcom-qusb2
            CONFIG_DEFAULT_kmod-phy-qcom-qmp-usb
            CONFIG_DEFAULT_kmod-usb-xhci-hcd
            CONFIG_DEFAULT_kmod-usb-ehci
            CONFIG_DEFAULT_kmod-usb-ohci
            CONFIG_DEFAULT_kmod-usb-storage
            CONFIG_DEFAULT_kmod-usb-storage-extras
            CONFIG_DEFAULT_kmod-usb-storage-uas
            CONFIG_DEFAULT_kmod-usb-storage-alauda
            CONFIG_DEFAULT_kmod-usb-storage-cypress-atacb
            CONFIG_DEFAULT_kmod-usb-storage-datafab
            CONFIG_DEFAULT_kmod-usb-storage-freecom
            CONFIG_DEFAULT_kmod-usb-storage-isd200
            CONFIG_DEFAULT_kmod-usb-storage-jumpshot
            CONFIG_DEFAULT_kmod-usb-storage-karma
            CONFIG_DEFAULT_kmod-usb-storage-sddr09
            CONFIG_DEFAULT_kmod-usb-storage-sddr55
            CONFIG_DEFAULT_kmod-usb-storage-usbat
            CONFIG_DEFAULT_kmod-usb-ledtrig-usbport
            CONFIG_DEFAULT_usbutils

            CONFIG_PACKAGE_kmod-usb-core
            CONFIG_PACKAGE_kmod-usb2
            CONFIG_PACKAGE_kmod-usb3
            CONFIG_PACKAGE_kmod-usb-dwc3
            CONFIG_PACKAGE_kmod-usb-dwc3-qcom
            CONFIG_PACKAGE_kmod-usb-phy-msm
            CONFIG_PACKAGE_kmod-usb-phy-qcom-dwc3
            CONFIG_PACKAGE_kmod-phy-qcom-qusb2
            CONFIG_PACKAGE_kmod-phy-qcom-qmp-usb
            CONFIG_PACKAGE_kmod-usb-xhci-hcd
            CONFIG_PACKAGE_kmod-usb-ehci
            CONFIG_PACKAGE_kmod-usb-ohci
            CONFIG_PACKAGE_kmod-usb-storage
            CONFIG_PACKAGE_kmod-usb-storage-extras
            CONFIG_PACKAGE_kmod-usb-storage-uas
            CONFIG_PACKAGE_kmod-usb-storage-alauda
            CONFIG_PACKAGE_kmod-usb-storage-cypress-atacb
            CONFIG_PACKAGE_kmod-usb-storage-datafab
            CONFIG_PACKAGE_kmod-usb-storage-freecom
            CONFIG_PACKAGE_kmod-usb-storage-isd200
            CONFIG_PACKAGE_kmod-usb-storage-jumpshot
            CONFIG_PACKAGE_kmod-usb-storage-karma
            CONFIG_PACKAGE_kmod-usb-storage-sddr09
            CONFIG_PACKAGE_kmod-usb-storage-sddr55
            CONFIG_PACKAGE_kmod-usb-storage-usbat
            CONFIG_PACKAGE_kmod-usb-ledtrig-usbport
            CONFIG_PACKAGE_usbutils
            CONFIG_PACKAGE_kmod-fs-ntfs3

            CONFIG_PACKAGE_luci-theme-openwrt
            CONFIG_PACKAGE_luci-theme-openwrt-2020
            CONFIG_PACKAGE_luci-theme-material
            CONFIG_PACKAGE_luci-theme-lightblue
            CONFIG_PACKAGE_luci-theme-design
            CONFIG_PACKAGE_luci-theme-argon
            CONFIG_PACKAGE_luci-app-argon-config
          )

          enable_symbols=(
            CONFIG_PACKAGE_luci-theme-bootstrap
            CONFIG_LUCI_LANG_zh_Hans
          )

          for sym in "${disable_symbols[@]}"; do
            sed -i "/^${sym}=.*/d" .config
            sed -i "/^# ${sym} is not set/d" .config
            echo "# ${sym} is not set" >> .config
          done

          for sym in "${enable_symbols[@]}"; do
            sed -i "/^${sym}=.*/d" .config
            sed -i "/^# ${sym} is not set/d" .config
            echo "${sym}=y" >> .config
          done

          make defconfig
          cp .config "$GITHUB_WORKSPACE/final.config"

          echo "===== TARGET ====="
          grep -E '^CONFIG_TARGET_|^CONFIG_TARGET_PROFILE=' .config || true

          echo "===== VERSION CHECK ====="
          grep -E '^CONFIG_VERSIONOPT=|^CONFIG_VERSION_DIST=' .config || true

          echo "===== DEVICE PACKAGE OVERRIDE ====="
          grep -E '^CONFIG_TARGET_DEVICE_PACKAGES_qualcommax_ipq60xx_DEVICE_zn_m2=' .config || true

          echo "===== LANG CHECK ====="
          grep -E '^CONFIG_LUCI_LANG_zh_Hans=|^CONFIG_PACKAGE_luci-i18n-.*zh-cn=' .config || true

          echo "===== THEME CHECK ====="
          grep -E '^CONFIG_PACKAGE_luci-theme-' .config || true

          echo "===== USB CHECK ====="
          grep -E '^(CONFIG_DEFAULT_|CONFIG_PACKAGE_)(kmod-usb|kmod-phy-qcom|kmod-usb-phy|usbutils|kmod-fs-ntfs3)' .config || true

          echo "===== KERNEL USB FRAGMENT ====="
          tail -n 20 target/linux/qualcommax/ipq60xx/config-6.12 || true

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Set artifact name
        id: vars
        run: |
          echo "DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: zn-m2-openwrt-${{ steps.vars.outputs.DATE }}
          path: |
            openwrt/bin/targets/**/*
            final.config
          retention-days: 14
